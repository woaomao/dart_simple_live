name: Build Windows

on:
  workflow_dispatch:   # 手动触发构建

jobs:
  build:
    runs-on: windows-latest   # 使用 GitHub 提供的 Windows Runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史，默认分支

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows
        run: flutter config --enable-windows-desktop
        working-directory: dart_simple_live   # ✅ 指定项目目录

      - name: Get packages
        run: flutter pub get
        working-directory: dart_simple_live   # ✅ 指定项目目录

      - name: Build Windows
        run: flutter build windows --release
        working-directory: dart_simple_live   # ✅ 指定项目目录

      - name: Upload artifact
        uses: actions/upload-artifact@v4   # ✅ 使用 v4
        with:
          name: windows-release
          path: dart_simple_live/build/windows/runner/Release/   # ✅ 路径加上项目目录
